[project]
name = "a2a-sample-agent-pdf-qa"
version = "0.1.0"
description = "Sample PDF QA agent with A2A Protocol using OpenAI and ChromaDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-samples",
    "click>=8.1.8",
    "pydantic>=2.10.6",
    "python-dotenv>=1.1.0",
    "chromadb>=0.4.0",
    "langchain-openai>=0.1.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.1",
    "PyPDF2>=3.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
a2a-samples = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
